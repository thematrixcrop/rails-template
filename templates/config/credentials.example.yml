# Layout for `bin/rails credentials:edit`.
#
# Rails keeps one encrypted credentials file for every environment
# (config/credentials.yml.enc). Production supplies RAILS_MASTER_KEY
# (the contents of config/master.key). Development uses config/master.key
# on disk; that file is gitignored.
#
# Store configuration that does not change with the environment: OAuth
# client IDs, API tokens, third-party secrets. Do not store database hosts,
# APP_HOST, or other machine-specific values here — those belong in `.env`
# (development) or the process environment (production).
#
# Read values through AppConfig.credential(:group, :key). A missing required
# value should return nil so the caller can refuse the feature.
#
# Example:
#
#   google:
#     client_id: xxx.apps.googleusercontent.com
#     client_secret: ...
#   mail:
#     from: "App <no-reply@example.com>"
#     smtp:
#       address: smtp.example.com
#       port: 587
#       user_name: ...
#       password: ...
#   mission_control:
#     http_basic_auth_user: admin
#     http_basic_auth_password: ...
